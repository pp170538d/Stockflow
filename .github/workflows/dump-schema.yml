# .github/workflows/dump-schema.yml
#
# Dumps the Supabase schema on GitHub's servers (no VPN / firewall issues)
# and commits it to the repo as the baseline migration.
#
# Run manually: GitHub repo -> Actions -> "Dump Supabase schema" -> Run workflow
#
# Required repo secret (Settings -> Secrets and variables -> Actions):
#   SUPABASE_DB_URL  - Session pooler connection string WITH the password, e.g.
#   postgresql://postgres.hjxdntwjjkiqlqadhdbt:PASSWORD@aws-1-eu-west-1.pooler.supabase.com:5432/postgres
#
# No access token / "supabase link" needed: the CLI connects straight to the
# database with --db-url (pg_dump runs in Docker, which GitHub runners have).

name: Dump Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "Secret SUPABASE_DB_URL is missing." && exit 1
          fi
          mkdir -p supabase/migrations
          npx --yes supabase db dump \
            --db-url "$SUPABASE_DB_URL" \
            -f supabase/migrations/20261001000000_baseline.sql
          echo "--- dump size ---"
          wc -l supabase/migrations/20261001000000_baseline.sql

      - name: Commit dump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20261001000000_baseline.sql
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(db): dump baseline schema"
          git push
