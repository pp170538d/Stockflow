# .github/workflows/dump-schema.yml
#
# Dumps the Supabase schema on GitHub's servers (no VPN / firewall issues)
# and commits it to the repo as the baseline migration.
#
# Run manually: GitHub repo -> Actions -> "Dump Supabase schema" -> Run workflow
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   SUPABASE_ACCESS_TOKEN  - supabase.com/dashboard/account/tokens
#   SUPABASE_DB_PASSWORD   - database password (Database -> Settings)
#   SUPABASE_PROJECT_REF   - e.g. hjxdntwjjkiqlqadhdbt
#
# The CLI is installed from npm (npx supabase), not via supabase/setup-cli,
# because setup-cli asks the GitHub API for the "latest" release and can hit
# "rate limit exceeded". Docker is already available on ubuntu runners.

name: Dump Supabase schema

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dump:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Dump schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          npx --yes supabase --version
          [ -f supabase/config.toml ] || npx --yes supabase init
          mkdir -p supabase/migrations
          npx --yes supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}"
          npx --yes supabase db dump --linked -f supabase/migrations/20261001000000_baseline.sql

      - name: Commit dump
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(db): dump baseline schema"
          git push
