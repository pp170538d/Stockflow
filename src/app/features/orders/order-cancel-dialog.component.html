<div class="fixed inset-0 z-[70] grid place-items-center bg-slate-950/45 p-4 backdrop-blur-sm" (click)="!saving && close.emit()">
  <section class="w-full max-w-lg rounded-2xl bg-white shadow-2xl" (click)="$event.stopPropagation()">
    <header class="border-b p-5"><div class="text-[10px] font-semibold uppercase tracking-wider text-red-600">Cancel purchase order</div><h2 class="mt-1 text-lg font-semibold">{{order.order_number}}</h2><p class="mt-1 text-sm text-slate-500">This order will stop counting as incoming stock. No inventory movement will be created and the document stays in history.</p></header>
    <div class="space-y-4 p-5">
      <label class="block"><span class="text-xs font-semibold text-slate-700">Reason *</span><select [ngModel]="reason()" (ngModelChange)="reason.set($event)" class="mt-1 h-11 w-full rounded-lg border border-slate-300 px-3 text-sm outline-none focus:border-brand-500"><option value="">Choose a reason</option>@for(r of reasons;track r.value){<option [value]="r.value">{{r.label}}</option>}</select></label>
      <label class="block"><span class="text-xs font-semibold text-slate-700">Note @if(reason()==='OTHER'){*}</span><textarea rows="3" [ngModel]="note()" (ngModelChange)="note.set($event)" placeholder="Optional context for the audit trail" class="mt-1 w-full resize-none rounded-lg border border-slate-300 px-3 py-2 text-sm outline-none focus:border-brand-500"></textarea></label>
      @if(error){<div class="rounded-xl bg-red-50 p-3 ring-1 ring-red-200"><b class="text-sm text-red-800">{{error.title}}</b><p class="mt-0.5 text-xs text-red-700">{{error.message}}</p><div class="mt-1 font-mono text-[10px] text-red-500">{{error.referenceId}}</div></div>}
    </div>
    <footer class="flex justify-end gap-2 border-t p-4"><button type="button" [disabled]="saving" (click)="close.emit()" class="rounded-lg border px-4 py-2 text-sm disabled:opacity-40">Keep order</button><button type="button" [disabled]="!canSubmit" (click)="submit()" class="rounded-lg bg-red-600 px-4 py-2 text-sm font-semibold text-white disabled:opacity-40">{{saving?'Cancelling…':'Cancel order'}}</button></footer>
  </section>
</div>
