<div class="grid min-h-screen place-items-center bg-slate-50 px-4">
  <div class="w-full max-w-sm">

    <!-- Brand -->
    <div class="mb-8 flex items-center justify-center gap-2">
      <div class="grid h-9 w-9 place-items-center rounded-lg bg-brand-600">
        <svg class="h-5 w-5 text-white" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M4 8h11M4 16h7" />
          <path d="m16 5 4 3-4 3" />
        </svg>
      </div>
      <span class="text-xl font-semibold tracking-tight text-slate-900">
        Stock<span class="text-brand-600">flow</span>
      </span>
    </div>

    <!-- Card -->
    <div class="rounded-2xl bg-white p-8 shadow-sm ring-1 ring-slate-200">
      <h1 class="text-lg font-semibold text-slate-900">Welcome back</h1>
      <p class="mt-1 text-sm text-slate-500">Sign in to your account to continue.</p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="mt-6 space-y-4">
        <!-- Email -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">Email</label>
          <input type="email" formControlName="email" autocomplete="email"
                 placeholder="you@company.com"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        text-slate-900 outline-none transition
                        focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" />
        </div>

        <!-- Password -->
        <div>
          <label class="mb-1.5 block text-sm font-medium text-slate-700">Password</label>
          <input type="password" formControlName="password" autocomplete="current-password"
                 placeholder="••••••••"
                 class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm
                        text-slate-900 outline-none transition
                        focus:border-brand-500 focus:ring-2 focus:ring-brand-500/20" />
        </div>

        <!-- Error -->
        @if (error()) {
          <div class="rounded-lg bg-red-50 px-3 py-2 text-sm text-red-600 ring-1 ring-red-100">
            {{ error() }}
          </div>
        }

        <!-- Submit -->
        <button type="submit" [disabled]="loading()"
                class="flex w-full items-center justify-center rounded-lg bg-brand-600
                       px-4 py-2.5 text-sm font-medium text-white transition
                       hover:bg-brand-700 disabled:opacity-60">
          @if (loading()) {
            <span>Signing in…</span>
          } @else {
            <span>Sign in</span>
          }
        </button>
      </form>
    </div>

    <p class="mt-6 text-center text-xs text-slate-400">
      Stockflow · Inventory &amp; Ordering
    </p>
  </div>
</div>
